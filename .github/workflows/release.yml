name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_ROOT: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine pytest pytest-asyncio pytest-timeout httpx pydantic prometheus-client PyYAML psycopg2-binary
      - run: python scripts/check-release-version.py --expected "${GITHUB_REF_NAME}"
      - run: python -m compileall -q catalogue-api/src catalogue-client/src docker examples
      - run: pytest -q tests/unit
      - run: python -m build catalogue-client --outdir dist/client
      - run: twine check dist/client/*
      - run: pip install --force-reinstall dist/client/*.whl
      - run: python -c "from openg2p_catalogue_client import CatalogueClient, CropVarietyDetailResponse"

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: catalogue-service
            dockerfile: Dockerfile
          - name: catalogue-api
            dockerfile: docker/catalogue-api/Dockerfile
          - name: catalogue-db-migration
            dockerfile: docker/db-migration/Dockerfile
          - name: catalogue-db-seed
            dockerfile: docker/db-seed/Dockerfile.sql
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_ROOT }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_ROOT }}/${{ matrix.name }}:${{ github.ref_name }}
          artifact-name: ${{ matrix.name }}-sbom.spdx.json
          output-file: /tmp/${{ matrix.name }}-sbom.spdx.json
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_ROOT }}/${{ matrix.name }}:${{ github.ref_name }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

  packages:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build catalogue-client --outdir dist/client
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/client
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm dependency build deployments/charts/openg2p-catalogue
      - run: helm lint deployments/charts/openg2p-catalogue
      - run: helm package deployments/charts/openg2p-catalogue --destination dist/chart
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm push dist/chart/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/client/*
            dist/chart/*
