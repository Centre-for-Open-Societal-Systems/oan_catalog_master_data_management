{{- if .Values.catalogueSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-seed" (include "catalogue.fullname" .) | lower | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "catalogue.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.catalogueSeed.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-seed" (include "catalogue.fullname" .) | trunc 63 }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.catalogueAPI.podSecurityContext | nindent 8 }}
      initContainers:
        - name: verify-schema
          image: {{ printf "%s:%s" .Values.schemaMigration.image.repository .Values.schemaMigration.image.tag | quote }}
          imagePullPolicy: {{ .Values.schemaMigration.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.catalogueAPI.containerSecurityContext | nindent 12 }}
          args:
            - --migrations
            - /migration/sql
            - --expected-version
            - {{ .Values.schemaMigration.expectedVersion | quote }}
            - --verify-only
            - --wait-seconds
            - {{ .Values.schemaMigration.waitSeconds | quote }}
          env:
            - name: PGHOST
              value: {{ tpl .Values.global.postgresqlHost $ | quote }}
            - name: PGPORT
              value: {{ .Values.global.catalogueDBPort | quote }}
            - name: PGDATABASE
              value: {{ tpl .Values.global.catalogueDB $ | quote }}
            - name: PGUSER
              value: {{ tpl .Values.global.catalogueDBUser $ | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.global.catalogueDBSecret $ | quote }}
                  key: {{ tpl .Values.global.catalogueDBUserPasswordKey $ | quote }}
      containers:
        - name: catalogue-seed
          image: {{ printf "%s:%s" .Values.catalogueSeed.image.repository .Values.catalogueSeed.image.tag | quote }}
          imagePullPolicy: {{ .Values.catalogueSeed.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.catalogueAPI.containerSecurityContext | nindent 12 }}
          command:
            - python
            - /seed/seed_catalogue_pack.py
            - --pack
            - {{ printf "%s/%s" .Values.catalogueSeed.packRoot .Values.catalogueSeed.countryPack | quote }}
            {{- with .Values.catalogueSeed.domains }}
            - --domains
            - {{ join "," . | quote }}
            {{- end }}
          env:
            - name: PGHOST
              value: {{ tpl .Values.global.postgresqlHost $ | quote }}
            - name: PGPORT
              value: {{ .Values.global.catalogueDBPort | quote }}
            - name: CATALOGUE_DB
              value: {{ tpl .Values.global.catalogueDB $ | quote }}
            - name: PGUSER
              value: {{ tpl .Values.global.catalogueDBUser $ | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.global.catalogueDBSecret $ | quote }}
                  key: {{ tpl .Values.global.catalogueDBUserPasswordKey $ | quote }}
          resources:
            {{- toYaml .Values.catalogueSeed.resources | nindent 12 }}
{{- end }}
