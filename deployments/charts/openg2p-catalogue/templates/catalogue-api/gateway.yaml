{{- if and .Values.catalogueAPI.enabled .Values.catalogueAPI.istio.enabled .Values.catalogueAPI.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "catalogue.apiName" . }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        name: http
        number: 8080
        protocol: HTTP
      hosts:
        - {{ tpl .Values.global.catalogueHostname $ | quote }}
{{- end }}

