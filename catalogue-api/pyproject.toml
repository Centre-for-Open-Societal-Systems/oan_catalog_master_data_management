[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-catalogue-service"
version = "0.2.0"
description = "OpenG2P versioned catalogue service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openg2p-fastapi-common>=1.1.4",
  "iam-core",
  "asyncpg",
  "psycopg2-binary",
  "fastapi-cache2",
  "prometheus-client>=0.20",
  "gunicorn",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openg2p_catalogue_service"]
